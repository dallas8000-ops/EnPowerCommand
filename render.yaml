# Render Blueprint — https://render.com/docs/infrastructure-as-code
# Order: deploy API + Postgres first; set Static Site build env VITE_API_URL to your API URL; then set API CORS_ORIGIN to the Static Site URL and redeploy API.

version: "1"

databases:
  - name: enpower-db
    databaseName: enpower
    user: enpower

services:
  - type: web
    name: enpower-command-api
    runtime: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: enpower-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Static sites on Render do not support `region` (see Blueprint validation).
  - type: web
    name: enpower-command-web
    runtime: static
    rootDir: .
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
